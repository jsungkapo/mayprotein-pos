<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8336d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>MayProtein POS · หลังบ้าน</title>
<link rel="stylesheet" href="styles.css">
<style>
.wrap{max-width:860px;margin:0 auto}
.tabs{position:sticky;top:0;z-index:5}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1}
.list .it{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .t small{color:var(--muted);font-size:12px}
.list .it .r{text-align:right;font-size:13px}
.list .it.off{opacity:.55}
.imgEdit{display:flex;gap:12px;align-items:center;margin:4px 0 6px}
.imgEdit .pv{position:relative;width:110px;height:110px;border-radius:12px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;flex:none}
.imgEdit .pv img{width:100%;height:100%;object-fit:cover}
.imgEdit .pv.qr{width:150px;height:auto;min-height:110px;background:#f3f3f3}
.imgEdit .pv.qr img{height:auto}
.imgEdit .up{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:11px;padding:5px;text-align:center}
.imgEdit .up .spin{width:12px;height:12px;border-width:2px}
.imgEdit .bt{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.chk input{width:22px;height:22px}
.sec{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.sec h4{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f2f2f2;font-size:14px;cursor:pointer}
.slot{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.slot .hd{display:flex;gap:8px;align-items:center}
.slot .hd input{width:70px;flex:none}
.picks{max-height:220px;overflow-y:auto;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px}
.picks label{display:flex;align-items:center;gap:8px;margin:0;padding:8px 10px;border-bottom:1px solid #f3f3f3;color:var(--text);font-size:14px}
.picks input{width:18px;height:18px;flex:none}
.urow{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}
.urow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.urow select{width:auto;padding:6px 8px;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
</style></head><body>
<header class="top">
  <div><div class="brand">หลังบ้าน</div><div style="font-size:12px;opacity:.9"><a href="index.html" style="color:#fff">← กลับหน้าขาย</a></div></div>
  <div class="who"><span id="whoName"></span><button onclick="POS.logout()">ออก</button></div>
</header>
<div class="tabs" id="tabs">
  <button class="on" data-t="prod">สินค้า</button><button data-t="pkg">แพ็กเกจ</button><button data-t="users">พนักงาน <span id="pendCnt"></span></button><button data-t="set">ตั้งค่า</button>
</div>
<div class="wrap">
  <div class="page on" id="p-prod">
    <div class="toolbar"><input id="qProd" placeholder="🔍 ค้นหาชื่อ / SKU"><button class="btn sm" onclick="editProduct()">+ เพิ่มสินค้า</button></div>
    <div class="list" id="prodList"><div class="loading"><span class="spin dark"></span>กำลังโหลด</div></div>
  </div>
  <div class="page" id="p-pkg">
    <div class="toolbar"><div style="flex:1;color:var(--muted);font-size:13px;align-self:center">เซตโปรโมชันที่ลูกค้าเลือกสินค้าในแต่ละช่องได้</div><button class="btn sm" onclick="editPackage()">+ เพิ่มแพ็กเกจ</button></div>
    <div class="list" id="pkgList"></div>
  </div>
  <div class="page" id="p-users"><div id="userList"></div></div>
  <div class="page" id="p-set"><div class="box" id="setBox"></div></div>
</div>

<div class="modal" id="mEdit"><div class="sheet" id="editSheet"></div></div>
<div class="modal" id="mSub"><div class="sheet" id="subSheet"></div></div>
<input type="file" id="fileIn" accept="image/*" style="display:none">

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const esc = POS.esc, money = POS.money, $ = id => document.getElementById(id);
let D = { products: [], variants: [], packages: [], settings: {}, users: [] }, me = null;
const list = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const P = id => D.products.find(p => p.product_id === id);
const V = id => D.variants.find(v => v.variant_id === id);
const varsOf = pid => D.variants.filter(v => v.product_id === pid);
const vLabel = v => [v.size, v.color].filter(Boolean).join(' / ');
function itemName(id) { const p = P(id); if (p) return p.name; const v = V(id); return v ? ((P(v.product_id) || {}).name || '') + ' ' + vLabel(v) : id; }
function closeM(m) { $(m).classList.remove('on'); }
function busy(btn, on, txt) { btn.disabled = on; if (on) { btn._t = btn.textContent; btn.innerHTML = '<span class="spin"></span>'; } else btn.textContent = txt || btn._t; }
function opts(arr, cur) { const a = arr.includes(cur) || !cur ? arr : [cur, ...arr]; return '<option value="">—</option>' + a.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join(''); }

// เริ่มหลังสคริปต์ทั้งไฟล์โหลดเสร็จ (ตัวแปรที่ประกาศด้านล่างจะพร้อมใช้)
window.addEventListener('DOMContentLoaded', () => POS.requireLogin(u => { me = u; $('whoName').textContent = u.display_name; load(); }, { adminOnly: true }));

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.t));
  if (b.dataset.t === 'users') load();
});
$('qProd').oninput = renderProducts;

const ADMIN_CACHE = 'pos_admin_cache';
async function load() {
  if (!D.products.length) {
    try { const c = JSON.parse(localStorage.getItem(ADMIN_CACHE) || 'null'); if (c && c.products) { D = c; renderAll(); } } catch (e) {}
  }
  try {
    const r = await POS.call('getAdminData'); delete r.ok; D = r; renderAll();
    try { localStorage.setItem(ADMIN_CACHE, JSON.stringify(D)); } catch (e) {}
  } catch (e) {
    POS.toast(e.message, true);
    if (!D.products.length) $('prodList').innerHTML = `<div class="empty">${esc(e.message)}<br><br><a onclick="load()">ลองใหม่</a></div>`;
  }
}
function renderAll() { renderProducts(); renderPackages(); renderUsers(); renderSettings(); }

/* ---------- image picking ---------- */
// รูปจะขึ้นตัวอย่างทันที แล้วอัปโหลดไป Google Drive เบื้องหลัง ปุ่มบันทึกจะรอให้อัปโหลดเสร็จก่อน
const uploads = new Set();
function pickFile() {
  return new Promise(resolve => {
    const f = $('fileIn'); f.value = '';
    let picked = false, done = false;
    const finish = v => { if (done) return; done = true; window.removeEventListener('focus', onFocus); resolve(v); };
    // กดยกเลิกในหน้าต่างเลือกรูป: เบราว์เซอร์ใหม่ยิง cancel, เบราว์เซอร์เก่าดูจากหน้าเว็บกลับมาโฟกัสแล้วไม่มีไฟล์
    const onFocus = () => setTimeout(() => { if (!picked && !f.files.length) finish(null); }, 3000);
    f.oncancel = () => finish(null);
    window.addEventListener('focus', onFocus);
    f.onchange = () => { picked = true; finish(f.files[0] || null); };
    f.click();
  });
}
function imgBlock(url, fallback, extra) {
  const up = String(url || '').startsWith('data:');
  return `<div class="imgEdit"><div class="pv ${extra || ''}">${url ? `<img src="${esc(url)}" alt="">` : fallback}${up ? '<div class="up"><span class="spin"></span> กำลังอัปโหลด</div>' : ''}</div><div class="bt"><button class="btn sm line" data-act="img">${url ? 'เปลี่ยนรูป' : 'อัปโหลดรูป'}</button>${url ? '<button class="btn sm danger" data-act="noimg">ลบรูป</button>' : ''}<div class="hint">${extra === 'qr' ? 'รูป QR พร้อมเพย์' : 'ระบบจะครอปเป็นสี่เหลี่ยมจัตุรัสให้'}</div></div></div>`;
}
function bindImg(root, getUrl, setUrl, mode) {
  const b1 = root.querySelector('[data-act="img"]'), b2 = root.querySelector('[data-act="noimg"]');
  b1.onclick = async () => {
    const file = await pickFile();
    if (!file) return;
    busy(b1, true);
    let data;
    try { data = mode === 'qr' ? await POS.scaledImage(file, 1000) : await POS.squareImage(file, 600); }
    catch (e) { POS.toast(e.message, true); busy(b1, false); return; }
    const before = getUrl();
    const mime = mode === 'qr' ? 'image/png' : 'image/jpeg';
    const preview = 'data:' + mime + ';base64,' + data;
    setUrl(preview, true);
    const job = POS.call('uploadImage', { data, mime, name: mode })
      .then(r => swap(r.url), e => { POS.toast('อัปโหลดรูปไม่สำเร็จ: ' + e.message, true); swap(before); })
      .finally(() => uploads.delete(job));
    // เปลี่ยนรูปตัวอย่างเป็นรูปจริงแบบไม่วาดฟอร์มใหม่ (พิมพ์ค้างอยู่ก็ไม่หลุด)
    function swap(url) {
      if (getUrl() !== preview) return;
      setUrl(url, false);
      const img = [...root.querySelectorAll('.pv img')].find(i => i.getAttribute('src') === preview);
      if (!img) return;
      const pv = img.parentNode;
      const up = pv.querySelector('.up'); if (up) up.remove();
      if (url) { img.src = url; } else { img.remove(); }
    }
    uploads.add(job);
  };
  if (b2) b2.onclick = () => { if (confirm('ลบรูปนี้?')) setUrl('', true); };
}
async function waitUploads(btn) {
  if (!uploads.size) return;
  btn.innerHTML = '<span class="spin"></span> รออัปโหลดรูปให้เสร็จ';
  await Promise.all([...uploads]);
}
const isTemp = u => String(u || '').startsWith('data:');

/* ---------- products ---------- */
function renderProducts() {
  const q = $('qProd').value.trim().toLowerCase();
  const rows = D.products.filter(p => !q || [p.name, p.sku, p.category, p.subcategory, ...varsOf(p.product_id).map(v => v.sku)].some(x => String(x || '').toLowerCase().includes(q)));
  $('prodList').innerHTML = rows.map(p => {
    const vs = varsOf(p.product_id);
    const st = p.has_variants ? vs.reduce((a, v) => a + v.stock_qty, 0) : p.stock_qty;
    return `<div class="it ${p.active ? '' : 'off'}" onclick="editProduct('${p.product_id}')"><div class="thumb">${p.image_url ? `<img src="${esc(p.image_url)}" loading="lazy">` : '📦'}</div>
      <div class="t"><b>${esc(p.name)}${p.active ? '' : '<span class="tag">ปิดขาย</span>'}</b><small>${esc(p.sku || '-')} · ${esc([p.category, p.subcategory].filter(Boolean).join(' › '))}${p.has_variants ? ` · ${vs.length} ตัวเลือก` : ''}</small></div>
      <div class="r"><b>${money(p.price)}฿</b><br><small style="color:${st <= 0 ? 'var(--bad)' : 'var(--muted)'}">สต็อก ${st}</small></div></div>`;
  }).join('') || '<div class="empty">ยังไม่มีสินค้า</div>';
}

function uniqueSku(base) {
  if (!base) return '';
  const used = new Set([...D.products.map(p => p.sku), ...D.variants.map(v => v.sku)].filter(Boolean));
  let sku = base + '-COPY', n = 2;
  while (used.has(sku)) sku = base + '-COPY' + n++;
  return sku;
}

/** copy = { from: product_id, data: ค่าที่คัดลอกมา } — ใช้ตอนกด "คัดลอกเป็นสินค้าใหม่" */
function editProduct(id, copy) {
  const p = id ? { ...P(id) } : copy ? { ...copy.data } : { name: '', sku: '', category: '', subcategory: '', unit: '', price: '', cost: '', description: '', image_url: '', active: true };
  const copyVars = copy ? varsOf(copy.from) : [];
  const s = D.settings;
  const el = $('editSheet');
  const render = () => {
    const vs = id ? varsOf(id) : [];
    el.innerHTML = `<h3>${id ? 'แก้ไขสินค้า' : copy ? 'คัดลอกสินค้า' : 'เพิ่มสินค้าใหม่'}</h3>
      ${copy ? `<div class="hint" style="margin-bottom:8px">คัดลอกจาก "${esc(itemName(copy.from))}" แก้ชื่อและรายละเอียดแล้วกดบันทึก${copyVars.length ? ` · ไซซ์/สี ${copyVars.length} ตัวเลือกจะถูกคัดลอกไปด้วย` : ''} · สต็อกเริ่มที่ 0</div>` : ''}
      ${imgBlock(p.image_url, '📦')}
      <label>ชื่อสินค้า *</label><input id="fName" value="${esc(p.name)}">
      <div class="row"><div><label>SKU</label><input id="fSku" value="${esc(p.sku)}" autocapitalize="characters"></div><div><label>หน่วย</label><select id="fUnit">${opts(list(s.units), p.unit)}</select></div></div>
      <div class="row"><div><label>หมวดหมู่</label><select id="fCat">${opts(list(s.categories), p.category)}</select></div><div><label>หมวดย่อย</label><select id="fSub">${opts(list(s.subcategories), p.subcategory)}</select></div></div>
      <div class="row"><div><label>ราคาขาย (บาท)</label><input id="fPrice" type="number" inputmode="decimal" value="${p.price}"></div><div><label>ต้นทุน (บาท)</label><input id="fCost" type="number" inputmode="decimal" value="${p.cost}"></div></div>
      <label>คำอธิบาย</label><textarea id="fDesc" rows="2">${esc(p.description)}</textarea>
      <label class="chk"><input type="checkbox" id="fAct" ${p.active ? 'checked' : ''}> เปิดขาย (แสดงในหน้าขาย)</label>
      ${id && !p.has_variants ? `<div class="hint">สต็อกปัจจุบัน ${p.stock_qty} — เพิ่ม/ลดสต็อกได้ที่หน้าขาย แท็บ "สต็อก"</div>` : ''}
      ${id ? `<div class="sec"><h4><span>ไซซ์ / สี (variation)</span><button class="btn sm line" onclick="editVariant('${id}')">+ เพิ่ม</button></h4>
        ${vs.map(v => `<div class="vrow" onclick="editVariant('${id}','${v.variant_id}')"><span>${esc(vLabel(v))} <small style="color:#888">${esc(v.sku)}</small>${v.active ? '' : '<span class="tag">ปิด</span>'}</span><span>${money(v.price == null ? p.price : v.price)}฿ · สต็อก ${v.stock_qty}</span></div>`).join('') || '<div class="hint">ไม่มี — ถ้าสินค้ามีไซซ์หรือสีให้เลือก (เช่น ถุงเท้า) ให้กดเพิ่ม แต่ละตัวเลือกจะมี SKU และสต็อกแยกกัน</div>'}
      </div>` : copyVars.length ? '' : '<div class="hint" style="margin-top:12px">บันทึกสินค้าก่อน แล้วจึงเพิ่มไซซ์/สีได้</div>'}
      <br><button class="btn" id="fSave">บันทึก</button>
      ${id ? '<br><br><button class="btn line" id="fCopy">📄 คัดลอกเป็นสินค้าใหม่</button>' : ''}
      <br><br><button class="btn g" onclick="closeM('mEdit')">ปิด</button>`;
    bindImg(el, () => p.image_url, (u, re) => { if (re === false) { p.image_url = u; return; } keep(); p.image_url = u; render(); }, 'sq');
    $('fSave').onclick = save;
    if (id) $('fCopy').onclick = () => {
      if (uploads.size) return POS.toast('รอให้อัปโหลดรูปเสร็จก่อน', true);
      keep();
      editProduct(null, { from: id, data: { ...p, name: p.name.trim() + ' (copy)', sku: uniqueSku(p.sku.trim()), active: true } });
    };
  };
  const keep = () => {
    p.name = $('fName').value; p.sku = $('fSku').value; p.unit = $('fUnit').value; p.category = $('fCat').value; p.subcategory = $('fSub').value;
    p.price = $('fPrice').value; p.cost = $('fCost').value; p.description = $('fDesc').value; p.active = $('fAct').checked;
  };
  const save = async () => {
    keep();
    if (!p.name.trim()) return POS.toast('กรุณาใส่ชื่อสินค้า', true);
    const b = $('fSave'); busy(b, true);
    await waitUploads(b);
    if (isTemp(p.image_url)) { POS.toast('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง', true); busy(b, false, 'บันทึก'); return; }
    try {
      const r = await POS.call('saveProduct', { product_id: id || '', name: p.name.trim(), sku: p.sku.trim(), unit: p.unit, category: p.category, subcategory: p.subcategory, price: +p.price || 0, cost: +p.cost || 0, description: p.description.trim(), image_url: p.image_url, active: p.active });
      POS.toast('บันทึกแล้ว');
      if (!id) {
        for (const v of copyVars) {
          b.innerHTML = '<span class="spin"></span> คัดลอกไซซ์/สี';
          await POS.call('saveVariant', { product_id: r.product_id, variant_id: '', size: v.size, color: v.color, sku: uniqueSku(v.sku), price: v.price == null ? '' : v.price, cost: v.cost == null ? '' : v.cost, image_url: v.image_url, active: v.active });
        }
        await load(); editProduct(r.product_id); return;
      }
      Object.assign(P(id), { name: p.name.trim(), sku: p.sku.trim(), unit: p.unit, category: p.category, subcategory: p.subcategory, price: +p.price || 0, cost: +p.cost || 0, description: p.description.trim(), image_url: p.image_url, active: p.active });
      renderProducts(); closeM('mEdit'); load();
    } catch (e) { POS.toast(e.message, true); busy(b, false); }
  };
  render();
  $('mEdit').classList.add('on');
  el.scrollTop = 0;
}

function editVariant(pid, vid) {
  const v = vid ? { ...V(vid) } : { size: '', color: '', sku: '', price: null, cost: null, image_url: '', active: true };
  const p = P(pid);
  const el = $('subSheet');
  el.innerHTML = `<h3>${vid ? 'แก้ไขตัวเลือก' : 'เพิ่มตัวเลือก'} · ${esc(p.name)}</h3>
    <div class="row"><div><label>ไซซ์</label><input id="vSize" value="${esc(v.size)}" placeholder="เช่น M"></div><div><label>สี</label><input id="vColor" value="${esc(v.color)}" placeholder="เช่น ดำ"></div></div>
    <label>SKU</label><input id="vSku" value="${esc(v.sku)}" autocapitalize="characters" placeholder="เช่น ${esc((p.sku || 'SKU') + '-M-BLK')}">
    <div class="row"><div><label>ราคา (เว้นว่าง = ${money(p.price)})</label><input id="vPrice" type="number" inputmode="decimal" value="${v.price ?? ''}"></div><div><label>ต้นทุน (เว้นว่าง = ตามสินค้าหลัก)</label><input id="vCost" type="number" inputmode="decimal" value="${v.cost ?? ''}"></div></div>
    <label class="chk"><input type="checkbox" id="vAct" ${v.active ? 'checked' : ''}> เปิดขาย</label>
    ${vid ? `<div class="hint">สต็อกปัจจุบัน ${v.stock_qty}</div>` : ''}
    <br><button class="btn" id="vSave">บันทึก</button><br><br><button class="btn g" onclick="closeM('mSub')">ยกเลิก</button>`;
  $('vSave').onclick = async () => {
    const b = $('vSave'); busy(b, true);
    try {
      await POS.call('saveVariant', { product_id: pid, variant_id: vid || '', size: $('vSize').value.trim(), color: $('vColor').value.trim(), sku: $('vSku').value.trim(), price: $('vPrice').value === '' ? '' : +$('vPrice').value, cost: $('vCost').value === '' ? '' : +$('vCost').value, image_url: v.image_url, active: $('vAct').checked });
      POS.toast('บันทึกแล้ว'); closeM('mSub'); await load(); editProduct(pid);
    } catch (e) { POS.toast(e.message, true); busy(b, false); }
  };
  $('mSub').classList.add('on');
}

/* ---------- packages ---------- */
function sellables() {
  const a = [];
  D.products.forEach(p => {
    if (p.has_variants) varsOf(p.product_id).forEach(v => a.push({ id: v.variant_id, name: p.name + ' ' + vLabel(v), active: p.active && v.active }));
    else a.push({ id: p.product_id, name: p.name, active: p.active });
  });
  return a;
}
function renderPackages() {
  $('pkgList').innerHTML = D.packages.map(k => `<div class="it ${k.active ? '' : 'off'}" onclick="editPackage('${k.package_id}')"><div class="thumb" style="background:#fff3c4">${k.image_url ? `<img src="${esc(k.image_url)}">` : '🎁'}</div>
    <div class="t"><b>${esc(k.name)}${k.active ? '' : '<span class="tag">ปิดขาย</span>'}</b><small>${k.slots.map(s => esc(s.slot) + ': ' + s.items.length + ' ตัวเลือก').join(' · ')}</small></div><div class="r"><b>${money(k.price)}฿</b></div></div>`).join('') || '<div class="empty">ยังไม่มีแพ็กเกจ</div>';
}
/** copy = { from: package_id, data: ค่าที่คัดลอกมา } */
function editPackage(id, copy) {
  const src = id ? D.packages.find(k => k.package_id === id) : copy ? copy.data : null;
  const k = src ? JSON.parse(JSON.stringify(src)) : { name: '', price: '', description: '', image_url: '', active: true, slots: [{ slot: 'A', qty: 1, items: [] }, { slot: 'B', qty: 1, items: [] }] };
  const all = sellables();
  const el = $('editSheet');
  const filters = {};
  const keep = () => {
    k.name = $('kName').value; k.price = $('kPrice').value; k.description = $('kDesc').value; k.active = $('kAct').checked;
    k.slots.forEach((s, i) => { s.slot = el.querySelector(`#sl${i}`).value.trim(); s.qty = +el.querySelector(`#sq${i}`).value || 1; });
  };
  const render = () => {
    el.innerHTML = `<h3>${id ? 'แก้ไขแพ็กเกจ' : copy ? 'คัดลอกแพ็กเกจ' : 'เพิ่มแพ็กเกจ'}</h3>
      ${copy ? `<div class="hint" style="margin-bottom:8px">คัดลอกจาก "${esc((D.packages.find(x => x.package_id === copy.from) || {}).name || '')}" พร้อมช่องสินค้าทั้งหมด แก้แล้วกดบันทึก</div>` : ''}
      ${imgBlock(k.image_url, '🎁')}
      <label>ชื่อแพ็กเกจ *</label><input id="kName" value="${esc(k.name)}">
      <label>ราคาเซต (บาท)</label><input id="kPrice" type="number" inputmode="decimal" value="${k.price}">
      <label>คำอธิบาย</label><input id="kDesc" value="${esc(k.description)}" placeholder="เช่น ซื้อ A + B รับ C">
      <label class="chk"><input type="checkbox" id="kAct" ${k.active ? 'checked' : ''}> เปิดขาย</label>
      <div class="sec"><h4><span>ช่องสินค้า</span><button class="btn sm line" id="addSlot">+ เพิ่มช่อง</button></h4>
      <div class="hint" style="margin-bottom:8px">แต่ละช่องเลือกได้ว่ามีสินค้าอะไรให้ลูกค้าเลือกบ้าง ถ้ามีมากกว่า 5 ตัวเลือก หน้าขายจะแสดงเป็นดรอปดาวน์</div>
      ${k.slots.map((s, i) => `<div class="slot"><div class="hd"><span>ช่อง</span><input id="sl${i}" value="${esc(s.slot)}"><span>จำนวน</span><input id="sq${i}" type="number" inputmode="numeric" value="${s.qty}" style="width:60px;flex:none"><span style="flex:1"></span><a data-del="${i}">ลบช่อง</a></div>
        <input data-filter="${i}" placeholder="🔍 กรองสินค้า" style="margin-top:8px" value="${esc(filters[i] || '')}">
        <div class="picks">${all.filter(x => !filters[i] || x.name.toLowerCase().includes(filters[i].toLowerCase()) || s.items.includes(x.id)).map(x => `<label><input type="checkbox" data-slot="${i}" value="${esc(x.id)}" ${s.items.includes(x.id) ? 'checked' : ''}>${esc(x.name)}${x.active ? '' : ' <span class="tag">ปิด</span>'}</label>`).join('') || '<div class="hint" style="padding:8px">ไม่มีสินค้า</div>'}</div>
        <div class="hint">เลือกแล้ว ${s.items.length} รายการ</div></div>`).join('')}
      </div>
      <br><button class="btn" id="kSave">บันทึก</button>
      ${id ? '<br><br><button class="btn line" id="kCopy">📄 คัดลอกเป็นแพ็กเกจใหม่</button>' : ''}
      <br><br><button class="btn g" onclick="closeM('mEdit')">ปิด</button>`;
    bindImg(el, () => k.image_url, (u, re) => { if (re === false) { k.image_url = u; return; } keep(); k.image_url = u; render(); }, 'sq');
    $('addSlot').onclick = () => { keep(); const used = k.slots.map(s => s.slot); let c = 65; while (used.includes(String.fromCharCode(c))) c++; k.slots.push({ slot: String.fromCharCode(c), qty: 1, items: [] }); render(); };
    el.querySelectorAll('[data-del]').forEach(a => a.onclick = () => { keep(); k.slots.splice(+a.dataset.del, 1); render(); });
    el.querySelectorAll('[data-slot]').forEach(c => c.onchange = () => { const s = k.slots[+c.dataset.slot]; s.items = c.checked ? [...new Set([...s.items, c.value])] : s.items.filter(x => x !== c.value); c.closest('.slot').querySelector('.hint:last-child').textContent = 'เลือกแล้ว ' + s.items.length + ' รายการ'; });
    el.querySelectorAll('[data-filter]').forEach(inp => inp.oninput = () => { keep(); filters[inp.dataset.filter] = inp.value; const pos = inp.selectionStart; render(); const n = el.querySelector(`[data-filter="${inp.dataset.filter}"]`); n.focus(); n.setSelectionRange(pos, pos); });
    if (id) $('kCopy').onclick = () => {
      if (uploads.size) return POS.toast('รอให้อัปโหลดรูปเสร็จก่อน', true);
      keep();
      const data = JSON.parse(JSON.stringify(k));
      delete data.package_id; data.name = k.name.trim() + ' (copy)'; data.active = true;
      editPackage(null, { from: id, data });
    };
    $('kSave').onclick = async () => {
      keep();
      const b = $('kSave'); busy(b, true);
      await waitUploads(b);
      if (isTemp(k.image_url)) { POS.toast('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง', true); busy(b, false, 'บันทึก'); return; }
      try {
        await POS.call('savePackage', { package_id: id || '', name: k.name.trim(), price: +k.price || 0, description: k.description.trim(), image_url: k.image_url, active: k.active, slots: k.slots });
        POS.toast('บันทึกแล้ว'); closeM('mEdit'); load();
      } catch (e) { POS.toast(e.message, true); busy(b, false); }
    };
  };
  render();
  $('mEdit').classList.add('on');
  el.scrollTop = 0;
}

/* ---------- users ---------- */
const ST = { active: ['ok', 'ใช้งาน'], pending: ['warn', 'รออนุมัติ'], disabled: ['bad', 'ปิดใช้งาน'] };
function renderUsers() {
  const order = { pending: 0, active: 1, disabled: 2 };
  const us = D.users.slice().sort((a, b) => order[a.status] - order[b.status]);
  const pend = us.filter(u => u.status === 'pending').length;
  $('pendCnt').innerHTML = pend ? `<span class="tag warn">${pend}</span>` : '';
  $('userList').innerHTML = us.map(u => {
    const self = u.user_id === me.user_id;
    return `<div class="urow"><div class="top"><div><b>${esc(u.display_name)}</b>${self ? ' <span class="tag">คุณ</span>' : ''}<br><small style="color:#888">@${esc(u.username)}</small></div><span class="tag ${ST[u.status][0]}">${ST[u.status][1]}</span></div>
      <div class="acts">
        <select data-role="${u.user_id}" ${self ? 'disabled' : ''}><option value="seller" ${u.role === 'seller' ? 'selected' : ''}>พนักงานขาย</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>แอดมิน</option></select>
        ${u.status === 'pending' ? `<button class="btn sm" data-st="${u.user_id}" data-v="active">อนุมัติ</button><button class="btn sm danger" data-st="${u.user_id}" data-v="disabled">ไม่อนุมัติ</button>` : ''}
        ${u.status === 'active' && !self ? `<button class="btn sm danger" data-st="${u.user_id}" data-v="disabled">ปิดบัญชี</button>` : ''}
        ${u.status === 'disabled' ? `<button class="btn sm line" data-st="${u.user_id}" data-v="active">เปิดบัญชี</button>` : ''}
        <button class="btn sm g" data-pin="${u.user_id}">รีเซ็ต PIN</button>
      </div></div>`;
  }).join('') || '<div class="empty">ยังไม่มีพนักงาน</div>';
  const upd = async (payload, okMsg) => { try { await POS.call('updateUser', payload); POS.toast(okMsg); load(); } catch (e) { POS.toast(e.message, true); renderUsers(); } };
  $('userList').querySelectorAll('[data-role]').forEach(s => s.onchange = () => upd({ user_id: s.dataset.role, role: s.value }, 'เปลี่ยนสิทธิ์แล้ว'));
  $('userList').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { if (b.dataset.v === 'disabled' && !confirm('ปิดบัญชีนี้? (จะถูกออกจากระบบทันที)')) return; busy(b, true); upd({ user_id: b.dataset.st, status: b.dataset.v }, 'อัปเดตแล้ว'); });
  $('userList').querySelectorAll('[data-pin]').forEach(b => b.onclick = () => { const pin = prompt('ตั้ง PIN ใหม่ (ตัวเลข 4–6 หลัก)'); if (pin) upd({ user_id: b.dataset.pin, pin: pin.trim() }, 'ตั้ง PIN ใหม่แล้ว'); });
}

/* ---------- settings ---------- */
function renderSettings() {
  const s = { ...D.settings };
  const el = $('setBox');
  const keep = () => ['shop_name', 'current_event', 'categories', 'subcategories', 'units'].forEach(k => s[k] = $('s_' + k).value);
  const render = () => {
    el.innerHTML = `<label>ชื่อร้าน</label><input id="s_shop_name" value="${esc(s.shop_name)}">
      <label>ชื่องานเริ่มต้น (พนักงานเปลี่ยนในเครื่องตัวเองได้)</label><input id="s_current_event" value="${esc(s.current_event)}">
      <label>หมวดหมู่ (คั่นด้วย ,)</label><input id="s_categories" value="${esc(s.categories)}">
      <label>หมวดย่อย (คั่นด้วย ,)</label><input id="s_subcategories" value="${esc(s.subcategories)}">
      <label>หน่วย (คั่นด้วย ,)</label><input id="s_units" value="${esc(s.units)}">
      <div class="sec"><h4>QR พร้อมเพย์</h4>${imgBlock(s.promptpay_qr_image_url, '📱', 'qr')}</div>
      <br><button class="btn" id="sSave">บันทึกการตั้งค่า</button>`;
    bindImg(el, () => s.promptpay_qr_image_url, (u, re) => { if (re === false) { s.promptpay_qr_image_url = u; return; } keep(); s.promptpay_qr_image_url = u; render(); }, 'qr');
    $('sSave').onclick = async () => {
      keep(); const b = $('sSave'); busy(b, true);
      await waitUploads(b);
      if (isTemp(s.promptpay_qr_image_url)) { POS.toast('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง', true); busy(b, false, 'บันทึกการตั้งค่า'); return; }
      try { const r = await POS.call('saveSettings', s); D.settings = r.settings; POS.toast('บันทึกแล้ว'); busy(b, false); }
      catch (e) { POS.toast(e.message, true); busy(b, false); }
    };
  };
  render();
}
</script></body></html>
