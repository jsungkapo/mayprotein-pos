<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MayProtein POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Sukhumvit Set","Prompt",sans-serif}
html,body{height:100%}
body{background:#f4f5f7;color:#222;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{background:#e8336d;color:#fff;padding:12px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;flex:none}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;flex:none}
.tabs button{flex:1;padding:12px;border:0;background:none;font-size:15px;color:#666}
.tabs button.on{color:#e8336d;border-bottom:3px solid #e8336d;font-weight:700}
main{flex:1;overflow-y:auto;min-height:0}
.page{display:none;padding:12px}.page.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.chip{padding:6px 14px;border-radius:20px;background:#fff;border:1px solid #ddd;white-space:nowrap;font-size:14px}
.chip.on{background:#e8336d;color:#fff;border-color:#e8336d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #0001;text-align:center;cursor:pointer;position:relative}
.badge{position:absolute;top:6px;right:6px;background:#e8336d;color:#fff;border-radius:12px;min-width:24px;height:24px;font-size:13px;font-weight:700;line-height:24px;padding:0 6px}
.img{aspect-ratio:1;background:#fde3ec;display:flex;align-items:center;justify-content:center;font-size:34px}
.card .n{font-size:13px;padding:6px 4px 0;height:36px;overflow:hidden}
.card .p{font-weight:700;color:#e8336d;padding-bottom:4px}
.card .s{font-size:11px;color:#888;padding-bottom:6px}
.pk .img{background:#fff3c4}
#cartPanel{flex:none;background:#fff;border-top:2px solid #e8336d;box-shadow:0 -4px 10px #0001;display:flex;flex-direction:column;max-height:38vh}
.cartHead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;font-size:14px;border-bottom:1px solid #eee;flex:none}
.cartHead a{color:#e8336d;font-weight:400;font-size:13px}
#lines{overflow-y:auto;flex:1;min-height:40px;padding:0 12px}
.line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f2f2f2;font-size:14px}
.line .nm{flex:1;min-width:0}
.line small{display:block;color:#888;font-size:11px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:16px;line-height:1}
.qty b{min-width:18px;text-align:center}
.lt{width:60px;text-align:right;font-weight:700}
.empty{color:#999;font-size:13px;padding:10px 0;text-align:center}
.payWrap{padding:8px 12px 12px;flex:none}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#e8336d;color:#fff;font-size:17px;font-weight:700}
.btn.g{background:#eee;color:#333}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow-y:auto}
.sheet h3{margin-bottom:10px}
label{display:block;font-size:13px;color:#666;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.pay{display:flex;gap:8px;margin-top:4px}
.pay button{flex:1;padding:12px 4px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:14px}
.pay button.on{border-color:#e8336d;background:#fde3ec;font-weight:700}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:14px 0}
.qr{width:240px;height:240px;margin:10px auto;background:repeating-linear-gradient(45deg,#000 0 8px,#fff 8px 16px);border:10px solid #fff;outline:2px solid #000}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi div{background:#fff;border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;color:#e8336d}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{padding:8px 12px;border:1px solid #ccc;border-radius:8px;background:#fff}
.opt button.on{background:#e8336d;color:#fff;border-color:#e8336d}
</style></head><body>
<header><span>MayProtein POS</span><span style="font-size:13px;font-weight:400">งาน: Bangkok Fit Expo</span></header>
<div class="tabs">
<button class="on" onclick="tab(0,this)">🛒 ขาย</button>
<button onclick="tab(1,this)">📦 เพิ่มสต็อก</button>
<button onclick="tab(2,this)">📊 สรุปวันนี้</button>
</div>

<main>
<div class="page on" id="p0">
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</div>

<div class="page" id="p1">
<div class="box">
<label>ชื่องาน / สถานที่</label><input value="Bangkok Fit Expo">
<label>สินค้า</label><select id="stkItem"></select>
<label>จำนวนที่เพิ่ม</label><input type="number" id="stkQty" value="10">
<label>หมายเหตุ</label><input placeholder="เช่น เติมของรอบบ่าย">
<br><br><button class="btn" onclick="addStock()">+ เพิ่มสต็อก</button>
</div>
<div class="box"><b>สต็อกคงเหลือ</b><table id="stkTable"></table></div>
</div>

<div class="page" id="p2">
<div class="kpi">
<div>ยอดขายรวม<b id="kTotal">0</b></div>
<div>จำนวนบิล<b id="kBills">0</b></div>
<div>เงินสด / โอน<b id="kCash" style="font-size:16px">0 / 0</b></div>
<div>พร้อมเพย์<b id="kPP" style="font-size:16px">0</b></div>
</div>
<div class="box"><b>แพ็กเกจที่ขายได้</b><table id="pkTable"></table></div>
<div class="box"><b>สินค้าที่ขายได้</b><table id="itTable"></table></div>
<button class="btn">⬇️ ดาวน์โหลดสรุปท้ายวัน (CSV)</button>
</div>
</main>

<div id="cartPanel">
<div class="cartHead"><span>🛒 ตะกร้า (<span id="cnt">0</span> ชิ้น)</span><a onclick="cart=[];renderCart()">ล้างตะกร้า</a></div>
<div id="lines"></div>
<div class="payWrap"><button class="btn" onclick="openCheckout()">ชำระเงิน · <span id="sum">0</span> บาท</button></div>
</div>

<div class="modal" id="mVar"><div class="sheet" id="varSheet"></div></div>
<div class="modal" id="mPk"><div class="sheet" id="pkSheet"></div></div>
<div class="modal" id="mPay"><div class="sheet">
<h3>ชำระเงิน</h3>
<div class="tot"><span>รวม</span><span id="sub">0</span></div>
<label>ส่วนลดท้ายบิล</label>
<div class="row"><input type="number" id="disc" value="0" oninput="calc()"><select id="dtype" onchange="calc()"><option value="baht">บาท</option><option value="pct">%</option></select></div>
<label>หมายเหตุ</label><textarea id="note" rows="2" placeholder="พิมพ์เพิ่มเติม..."></textarea>
<label>วิธีชำระเงิน</label>
<div class="pay" id="pay"><button class="on" data-m="cash">💵 เงินสด</button><button data-m="transfer">🏦 โอน</button><button data-m="promptpay">📱 พร้อมเพย์</button></div>
<div id="qrBox" style="display:none;text-align:center"><div class="qr"></div><small>รูป QR ที่อัปโหลดไว้ (ตัวอย่าง)</small></div>
<div class="tot"><span>ยอดสุทธิ</span><span id="net">0</span></div>
<button class="btn" onclick="pay()">✅ ยืนยันการขาย</button><br><br>
<button class="btn g" onclick="close_('mPay')">ยกเลิก</button>
</div></div>

<script>
const products=[
{id:'P001',name:'May Protein กล้วย',cat:'อาหารเสริม',sub:'โปรตีน',price:60,stock:50,e:'🍌'},
{id:'P002',name:'May Protein โกโก้',cat:'อาหารเสริม',sub:'โปรตีน',price:60,stock:50,e:'🍫'},
{id:'P003',name:'May Protein พีช',cat:'อาหารเสริม',sub:'โปรตีน',price:60,stock:50,e:'🍑'},
{id:'P005',name:'Pre-Workout',cat:'อาหารเสริม',sub:'พรีเวิร์กเอาต์',price:90,stock:30,e:'⚡'},
{id:'P006',name:'เสื้อยืด May',cat:'เสื้อผ้า',sub:'More',price:350,stock:15,e:'👕'},
{id:'P004',name:'ถุงเท้ากีฬา',cat:'อุปกรณ์',sub:'More',price:150,e:'🧦',variants:[
 {id:'V001',size:'M',color:'ดำ',stock:20},{id:'V002',size:'L',color:'ดำ',stock:20},{id:'V003',size:'M',color:'ขาว',stock:20},{id:'V004',size:'L',color:'ขาว',stock:20}]}
];
const packages=[{id:'PK001',name:'เซตโปรตีน 3 ซอง',price:120,e:'🎁',slots:[
 {slot:'A',items:['P001','P002','P003']},{slot:'B',items:['P001','P002','P003']},{slot:'C',items:['P003']}]}];
let cart=[],sales=[],cat='ทั้งหมด',method='cash';
const P=id=>products.find(p=>p.id===id);
function tab(i,b){document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('on',i===j));
document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
document.getElementById('cartPanel').style.display=i===0?'flex':'none';if(i===1)renderStock();if(i===2)renderSum();}
function renderChips(){const cs=['ทั้งหมด','แพ็กเกจ','อาหารเสริม','เสื้อผ้า','อุปกรณ์'];
document.getElementById('chips').innerHTML=cs.map(c=>`<div class="chip ${c===cat?'on':''}" onclick="cat='${c}';renderChips();renderGrid()">${c}</div>`).join('');}
function stockOf(p){return p.variants?p.variants.reduce((a,v)=>a+v.stock,0):p.stock}
function inCart(prefix){return cart.filter(c=>c.key===prefix||c.key.startsWith(prefix+'|')||c.pid===prefix).reduce((a,c)=>a+c.qty,0)}
function badge(n){return n?`<div class="badge">${n}</div>`:''}
function renderGrid(){let h='';
if(cat==='ทั้งหมด'||cat==='แพ็กเกจ')h+=packages.map(k=>`<div class="card pk" onclick="openPk('${k.id}')">${badge(inCart(k.id))}<div class="img">${k.e}</div><div class="n">${k.name}</div><div class="p">${k.price}฿</div><div class="s">แพ็กเกจ</div></div>`).join('');
if(cat!=='แพ็กเกจ')h+=products.filter(p=>cat==='ทั้งหมด'||p.cat===cat).map(p=>`<div class="card" onclick="tapP('${p.id}')">${badge(inCart(p.id))}<div class="img">${p.e}</div><div class="n">${p.name}</div><div class="p">${p.price}฿</div><div class="s">คงเหลือ ${stockOf(p)}</div></div>`).join('');
document.getElementById('grid').innerHTML=h;}
function addLine(line){const ex=cart.find(c=>c.key===line.key);if(ex)ex.qty++;else cart.push({...line,qty:1});renderCart();}
function tapP(id){const p=P(id);if(p.variants)return openVar(p);addLine({key:p.id,name:p.name,price:p.price,items:[{id:p.id,name:p.name}]});}
function openVar(p){document.getElementById('varSheet').innerHTML=`<h3>${p.name}</h3><div class="opt">${p.variants.map(v=>`<button onclick="addVar('${p.id}','${v.id}')">${v.size} / ${v.color} (${v.stock})</button>`).join('')}</div><br><button class="btn g" onclick="close_('mVar')">ปิด</button>`;document.getElementById('mVar').classList.add('on');}
function addVar(pid,vid){const p=P(pid),v=p.variants.find(x=>x.id===vid);const n=`${p.name} ${v.size}/${v.color}`;close_('mVar');addLine({key:vid,pid,name:n,price:p.price,items:[{id:vid,pid,name:n}]});}
let pkSel={};
function openPk(id){const k=packages.find(x=>x.id===id);pkSel={};
document.getElementById('pkSheet').innerHTML=`<h3>${k.name} · ${k.price}฿</h3>`+k.slots.map(s=>`<label>ช่อง ${s.slot}</label><div class="opt">${s.items.map(i=>`<button id="o${s.slot}${i}" onclick="selSlot('${s.slot}','${i}')">${P(i).name}</button>`).join('')}</div>`).join('')+`<br><button class="btn" onclick="addPk('${id}')">เพิ่มเซตลงตะกร้า</button><br><br><button class="btn g" onclick="close_('mPk')">ยกเลิก</button>`;
k.slots.forEach(s=>{if(s.items.length===1)selSlot(s.slot,s.items[0])});document.getElementById('mPk').classList.add('on');}
function selSlot(s,i){pkSel[s]=i;document.querySelectorAll(`[id^="o${s}"]`).forEach(b=>b.classList.toggle('on',b.id==='o'+s+i));}
function addPk(id){const k=packages.find(x=>x.id===id);if(k.slots.some(s=>!pkSel[s.slot]))return alert('เลือกให้ครบทุกช่อง');
const sel=k.slots.map(s=>pkSel[s.slot]);close_('mPk');
addLine({key:id+'|'+sel.join(','),name:k.name,price:k.price,pk:id,items:k.slots.map(s=>({id:pkSel[s.slot],slot:s.slot,name:P(pkSel[s.slot]).name}))});}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart();}
function renderCart(){document.getElementById('lines').innerHTML=cart.map((c,i)=>`<div class="line"><div class="nm">${c.name}${c.pk?'<small>'+c.items.map(x=>x.slot+': '+x.name.replace('May Protein ','')).join(' · ')+'</small>':''}<small>${c.price}฿ / ชิ้น</small></div><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${c.qty}</b><button onclick="chg(${i},1)">+</button></div><div class="lt">${c.price*c.qty}฿</div></div>`).join('')||'<div class="empty">แตะสินค้าด้านบนเพื่อเพิ่มลงตะกร้า</div>';
document.getElementById('sum').textContent=cart.reduce((a,c)=>a+c.price*c.qty,0);
document.getElementById('cnt').textContent=cart.reduce((a,c)=>a+c.qty,0);renderGrid();}
function close_(m){document.getElementById(m).classList.remove('on')}
function openCheckout(){if(!cart.length)return;document.getElementById('mPay').classList.add('on');calc();}
document.querySelectorAll('#pay button').forEach(b=>b.onclick=()=>{method=b.dataset.m;document.querySelectorAll('#pay button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('qrBox').style.display=method==='promptpay'?'block':'none';});
function calc(){const s=cart.reduce((a,c)=>a+c.price*c.qty,0),d=+document.getElementById('disc').value||0,t=document.getElementById('dtype').value;
const da=t==='pct'?s*d/100:d;document.getElementById('sub').textContent=s;document.getElementById('net').textContent=Math.max(0,s-da).toFixed(0);return{s,da};}
function deduct(it,q){if(it.pid){P(it.pid).variants.find(v=>v.id===it.id).stock-=q}else P(it.id).stock-=q}
function pay(){const {s,da}=calc();cart.forEach(c=>c.items.forEach(it=>deduct(it,c.qty)));
sales.push({total:s-da,method,lines:cart});cart=[];renderCart();close_('mPay');
document.getElementById('disc').value=0;document.getElementById('note').value='';alert('บันทึกการขายแล้ว ✅');}
function allItems(){let a=[];products.forEach(p=>p.variants?p.variants.forEach(v=>a.push({id:v.id,name:`${p.name} ${v.size}/${v.color}`,stock:v.stock,ref:v})):a.push({id:p.id,name:p.name,stock:p.stock,ref:p}));return a}
function renderStock(){const a=allItems();document.getElementById('stkItem').innerHTML=a.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
document.getElementById('stkTable').innerHTML=a.map(x=>`<tr><td>${x.name}</td><td>${x.stock}</td></tr>`).join('');}
function addStock(){const id=document.getElementById('stkItem').value,q=+document.getElementById('stkQty').value;allItems().find(x=>x.id===id).ref.stock+=q;renderStock();alert('เพิ่มสต็อกแล้ว');}
function renderSum(){const by=m=>sales.filter(x=>x.method===m).reduce((a,x)=>a+x.total,0);
document.getElementById('kTotal').textContent=sales.reduce((a,x)=>a+x.total,0).toFixed(0);document.getElementById('kBills').textContent=sales.length;
document.getElementById('kCash').textContent=by('cash').toFixed(0)+' / '+by('transfer').toFixed(0);document.getElementById('kPP').textContent=by('promptpay').toFixed(0);
const pk={},it={};sales.forEach(s=>s.lines.forEach(c=>{if(c.pk)pk[c.name]=(pk[c.name]||0)+c.qty;c.items.forEach(x=>it[x.name]=(it[x.name]||0)+c.qty)}));
document.getElementById('pkTable').innerHTML=Object.entries(pk).map(([k,v])=>`<tr><td>${k}</td><td>${v} เซต</td></tr>`).join('')||'<tr><td>-</td></tr>';
document.getElementById('itTable').innerHTML=Object.entries(it).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')||'<tr><td>-</td></tr>';}
renderChips();renderCart();
</script></body></html>
