<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="May POS">
<meta name="theme-color" content="#e8336d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>MayProtein POS</title>
<link rel="stylesheet" href="styles.css">
<style>
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
main{flex:1;overflow-y:auto;min-height:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{padding:6px 14px;border-radius:20px;background:#fff;border:1px solid #ddd;white-space:nowrap;font-size:14px;cursor:pointer}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.search{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #0001;text-align:center;cursor:pointer;position:relative;user-select:none}
.card:active{transform:scale(.97)}
.badge{position:absolute;top:6px;right:6px;background:var(--pink);color:#fff;border-radius:12px;min-width:24px;height:24px;font-size:13px;font-weight:700;line-height:24px;padding:0 6px;z-index:1}
.img{aspect-ratio:1;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.card .n{font-size:13px;padding:6px 4px 0;height:36px;overflow:hidden;line-height:1.35}
.card .p{font-weight:700;color:var(--pink);padding-bottom:4px}
.card .s{font-size:11px;color:#888;padding-bottom:6px}
.card .s.low{color:var(--bad);font-weight:700}
.pk .img{background:#fff3c4}
#cartPanel{flex:none;background:#fff;border-top:2px solid var(--pink);box-shadow:0 -4px 10px #0001;display:flex;flex-direction:column;max-height:38vh}
.cartHead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;font-size:14px;border-bottom:1px solid #eee;flex:none}
.cartHead a{font-weight:400;font-size:13px}
#lines{overflow-y:auto;flex:1;min-height:40px;padding:0 12px}
.line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f2f2f2;font-size:14px}
.line .nm{flex:1;min-width:0}
.line small{display:block;color:#888;font-size:11px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:16px;line-height:1}
.qty b{min-width:18px;text-align:center}
.lt{width:64px;text-align:right;font-weight:700}
.payWrap{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));flex:none}
.pay{display:flex;gap:8px;margin-top:4px}
.pay button{flex:1;padding:12px 4px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:14px}
.pay button.on{border-color:var(--pink);background:var(--pink-soft);font-weight:700}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:14px 0}
.slip{display:flex;align-items:center;gap:10px;background:#f6f7f9;border-radius:10px;padding:10px;margin-top:10px}
.slip img{width:64px;height:84px;object-fit:cover;border-radius:6px;flex:none;background:#ddd}
.slip .t{flex:1;font-size:13px;color:#555}
.slip .t b{display:block;color:var(--text);font-size:14px}
.slip .acts{display:flex;flex-direction:column;gap:6px}
.qrimg{display:block;max-width:280px;width:100%;margin:10px auto;border-radius:8px}
.qrfull{position:fixed;inset:0;background:#fff;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.qrfull.on{display:flex}
.qrfull img{max-width:92vw;max-height:70vh}
.qrfull .amt{font-size:32px;font-weight:800;color:var(--pink);margin:14px 0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi div{background:#fff;border-radius:12px;padding:12px;font-size:13px;color:#666}
.kpi b{display:block;font-size:22px;color:var(--pink);margin-top:2px}
.pkslot{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.pkh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.pkh span{color:var(--muted);font-size:13px}
.pkst{margin-left:auto;font-weight:700;padding:2px 10px;border-radius:12px;background:#eee;color:#666!important}
.pkst.ok{background:#e1f5ea;color:var(--ok)!important}.pkst.over{background:#fde4e4;color:var(--bad)!important}
.pkrow{display:flex;gap:8px;margin-bottom:6px}
.pkrow select{flex:1;min-width:0}
.qbtn{width:64px;flex:none;border:1.5px solid var(--pink);border-radius:8px;background:#fff;font-size:20px;font-weight:800;color:var(--pink)}
.qbtn.zero{border-color:#ccc;color:#bbb}
#mNum{z-index:30}
.numpad{max-width:380px}
.npt{font-size:14px;color:var(--muted);text-align:center}
.npv{font-size:44px;font-weight:800;text-align:center;margin:6px 0 12px;color:var(--pink)}
.npk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.npk button{height:58px;border:0;border-radius:12px;background:#f1f1f4;font-size:26px;font-weight:600}
.npk button:active{background:#ddd}
.npk button.fn{font-size:17px;color:#666}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{padding:9px 12px;border:1px solid #ccc;border-radius:8px;background:#fff}
.opt button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.ok{text-align:center}
.ok .ic{font-size:52px}
.ok .bn{font-size:34px;font-weight:800;color:var(--pink);letter-spacing:1px;margin:4px 0}
.rc{background:#fafafa;border-radius:10px;padding:10px;text-align:left;margin:12px 0;font-size:14px}
.rc .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.rc small{color:#888;display:block;font-size:11px}
.bill{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden}
.bill .h{display:flex;justify-content:space-between;align-items:center;padding:12px;cursor:pointer}
.bill .h b{color:var(--pink)}
.bill .d{display:none;padding:0 12px 12px;font-size:13px}
.bill.open .d{display:block}
.menu{position:absolute;right:10px;top:54px;background:#fff;border-radius:12px;box-shadow:0 6px 24px #0003;z-index:30;display:none;min-width:180px;overflow:hidden}
.menu.on{display:block}
.menu a,.menu div{display:block;padding:12px 16px;color:var(--text);border-bottom:1px solid #f0f0f0;font-size:15px;text-decoration:none}
.menu div{color:var(--muted);font-size:12px}
tr.low td{color:var(--bad)}
</style></head><body>
<header class="top">
  <div><div class="brand" id="shopName">MayProtein POS</div><div style="font-size:12px;opacity:.9;cursor:pointer" id="evName" onclick="editEvent()"></div></div>
  <div class="who"><span id="whoName"></span><button id="menuBtn">☰</button></div>
</header>
<div class="menu" id="menu"></div>
<div class="tabs" id="tabs"></div>

<main>
  <div class="page on" id="p-sell">
    <input class="search" id="q" placeholder="🔍 ค้นหาสินค้า / SKU" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"><div class="loading"><span class="spin dark"></span>กำลังโหลดสินค้า</div></div>
  </div>

  <div class="page" id="p-bills">
    <div class="box" style="display:flex;justify-content:space-between;align-items:center">
      <span>บิลวันนี้ <b id="bCnt">0</b> บิล · รวม <b id="bSum" style="color:var(--pink)">0</b> ฿</span>
      <button class="btn sm line" onclick="loadToday(true)">↻</button>
    </div>
    <div id="billList"></div>
  </div>

  <div class="page" id="p-sum">
    <div class="kpi">
      <div>ยอดขายสุทธิ<b id="kTotal">0</b></div>
      <div>จำนวนบิล<b id="kBills">0</b></div>
      <div>💵 เงินสด<b id="kCash">0</b></div>
      <div>🏦 โอน<b id="kTr">0</b></div>
      <div>📱 พร้อมเพย์<b id="kPP">0</b></div>
      <div>ส่วนลดรวม<b id="kDisc">0</b></div>
    </div>
    <div class="box"><b>แพ็กเกจที่ขายได้</b><table id="pkTable"></table></div>
    <div class="box"><b>สินค้าที่ขายได้ (รวมในแพ็กเกจ)</b><table id="itTable"></table></div>
    <button class="btn" onclick="downloadCsv()">⬇️ ดาวน์โหลดสรุปท้ายวัน (CSV)</button><br><br>
  </div>
</main>

<div id="cartPanel">
  <div class="cartHead"><span>🛒 ตะกร้า (<span id="cnt">0</span> ชิ้น)</span><a onclick="clearCart()">ล้างตะกร้า</a></div>
  <div id="lines"></div>
  <div class="payWrap"><button class="btn" onclick="openCheckout()">ชำระเงิน · <span id="sum">0</span> บาท</button></div>
</div>

<div class="modal" id="mVar"><div class="sheet" id="varSheet"></div></div>
<div class="modal" id="mPk"><div class="sheet" id="pkSheet"></div></div>
<div class="modal" id="mNum"><div class="sheet numpad">
  <div class="npt" id="npTitle"></div>
  <div class="npv" id="npVal">0</div>
  <div class="npk"><button onclick="npKey('1')">1</button><button onclick="npKey('2')">2</button><button onclick="npKey('3')">3</button><button onclick="npKey('4')">4</button><button onclick="npKey('5')">5</button><button onclick="npKey('6')">6</button><button onclick="npKey('7')">7</button><button onclick="npKey('8')">8</button><button onclick="npKey('9')">9</button><button class="fn" onclick="npKey('clr')">ล้าง</button><button onclick="npKey('0')">0</button><button class="fn" onclick="npKey('del')">⌫</button></div>
  <button class="btn" onclick="npOk()">ตกลง</button><br><br><button class="btn g" onclick="closeM('mNum')">ยกเลิก</button>
</div></div>
<div class="modal" id="mOk"><div class="sheet ok" id="okSheet"></div></div>
<div class="modal" id="mPay"><div class="sheet">
  <h3>ชำระเงิน</h3>
  <div class="tot"><span>รวม</span><span id="sub">0</span></div>
  <label>ส่วนลดท้ายบิล</label>
  <div class="row"><input type="number" inputmode="decimal" id="disc" value="0" oninput="calc()"><select id="dtype" onchange="calc()" style="flex:none;width:90px"><option value="baht">บาท</option><option value="percent">%</option></select></div>
  <label>หมายเหตุ</label><textarea id="note" rows="2" placeholder="พิมพ์เพิ่มเติม..."></textarea>
  <label>วิธีชำระเงิน</label>
  <div class="pay" id="pay"><button class="on" data-m="cash">💵 เงินสด</button><button data-m="transfer">🏦 โอน</button><button data-m="promptpay">📱 พร้อมเพย์</button></div>
  <div id="qrBox" style="display:none;text-align:center"></div>
  <div id="slipBox" style="display:none"></div>
  <input type="file" id="slipIn" accept="image/*" capture="environment" style="display:none">
  <div class="tot"><span>ยอดสุทธิ</span><span id="net">0</span></div>
  <button class="btn" id="payBtn" onclick="pay()">✅ ยืนยันการขาย</button><br><br>
  <button class="btn g" onclick="closeM('mPay')">ยกเลิก</button>
</div></div>
<div class="qrfull" id="qrFull" onclick="this.classList.remove('on')"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const esc = POS.esc, money = POS.money;
const MLABEL = { cash: '💵 เงินสด', transfer: '🏦 โอน', promptpay: '📱 พร้อมเพย์' };
const EMOJI = { 'โปรตีน': '🥤', 'พรีเวิร์กเอาต์': '⚡', 'เสื้อผ้า': '👕', 'อุปกรณ์': '🧦', 'อาหารเสริม': '💊' };
let me = null, cat = { products: [], variants: [], packages: [], settings: {} };
let cart = [], chip = 'ทั้งหมด', method = 'cash', today = { bills: [] }, clientId = null, paying = false;

const $ = id => document.getElementById(id);
const P = id => cat.products.find(p => p.product_id === id);
const V = id => cat.variants.find(v => v.variant_id === id);
const varsOf = pid => cat.variants.filter(v => v.product_id === pid);
function vName(v) { const p = P(v.product_id); return (p ? p.name : '') + ' ' + [v.size, v.color].filter(Boolean).join('/'); }
function vPrice(v) { return v.price == null ? (P(v.product_id) || {}).price || 0 : v.price; }
function itemName(id) { const p = P(id); if (p) return p.name; const v = V(id); return v ? vName(v) : id; }
function itemStock(id) { const p = P(id); if (p && !p.has_variants) return p.stock_qty; const v = V(id); return v ? v.stock_qty : null; }
function imgHtml(url, fallback) { return url ? `<img src="${esc(url)}" loading="lazy" alt="">` : fallback; }
function emojiOf(p) { return EMOJI[p.subcategory] || EMOJI[p.category] || '📦'; }

/* ---------- boot ---------- */
// เริ่มหลังสคริปต์ทั้งไฟล์โหลดเสร็จ (ตัวแปรที่ประกาศด้านล่างจะพร้อมใช้)
window.addEventListener('DOMContentLoaded', () => POS.requireLogin(u => { me = u; boot(); }));

function boot() {
  $('whoName').textContent = me.display_name;
  const tabs = [['sell', '🛒 ขาย'], ...(POS.isAdmin() ? [['bills', '🧾 รายการขาย']] : []), ...(POS.isAdmin() ? [['sum', '📊 สรุป']] : [])];
  $('tabs').innerHTML = tabs.map(([k, l], i) => `<button data-t="${k}" class="${i ? '' : 'on'}">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => tab(b.dataset.t, b));
  if (tabs.length === 1) $('tabs').style.display = 'none';
  $('menu').innerHTML = `<div>${esc(me.display_name)} · ${me.role === 'admin' ? 'แอดมิน' : 'พนักงานขาย'}</div>` +
    (POS.isAdmin() ? '<a href="admin.html">⚙️ หลังบ้าน</a>' : '') + '<a onclick="POS.logout()">ออกจากระบบ</a>';
  $('menuBtn').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('on'); };
  document.addEventListener('click', () => $('menu').classList.remove('on'));
  $('q').oninput = renderGrid;
  document.querySelectorAll('#pay button').forEach(b => b.onclick = () => { method = b.dataset.m; document.querySelectorAll('#pay button').forEach(x => x.classList.toggle('on', x === b)); renderQr(); renderSlip(); });
  renderCart();
  loadCatalog();
}

const CAT_CACHE = 'pos_catalog_cache';
function applyCatalog() {
  $('shopName').textContent = (cat.settings.shop_name || 'MayProtein') + ' POS';
  if (!POS.pref('event') && cat.settings.current_event) POS.pref('event', cat.settings.current_event);
  showEvent();
  cart = cart.filter(c => c.type === 'package' ? cat.packages.some(k => k.package_id === c.id) : !!(P(c.id) || V(c.id)));
  renderChips(); renderCart();
}
function saveCatalogCache() { try { localStorage.setItem(CAT_CACHE, JSON.stringify(cat)); } catch (e) {} }
async function loadCatalog() {
  // แสดงสินค้าที่จำไว้ในเครื่องทันที แล้วค่อยอัปเดตจากเซิร์ฟเวอร์
  if (!cat.products.length) {
    try { const c = JSON.parse(localStorage.getItem(CAT_CACHE) || 'null'); if (c && c.products) { cat = c; applyCatalog(); } } catch (e) {}
  }
  try {
    const r = await POS.call('getCatalog');
    delete r.ok;
    cat = r;
    saveCatalogCache();
    applyCatalog();
    return;
  } catch (e) { POS.toast(e.message, true); if (!cat.products.length) $('grid').innerHTML = `<div class="empty">${esc(e.message)}<br><br><a onclick="loadCatalog()">ลองใหม่</a></div>`; }
}

function showEvent() { const ev = POS.pref('event') || ''; $('evName').textContent = '📍 ' + (ev || 'แตะเพื่อใส่ชื่องาน'); }
function editEvent() {
  const v = prompt('ชื่องาน / สถานที่ (บันทึกกับทุกบิลจากเครื่องนี้)', POS.pref('event') || '');
  if (v === null) return;
  POS.pref('event', v.trim()); showEvent(); POS.toast('บันทึกชื่องานแล้ว');
}

function tab(k, b) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + k));
  $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('cartPanel').style.display = k === 'sell' ? 'flex' : 'none';
  if (k === 'bills' || k === 'sum') loadToday();
}

/* ---------- sell ---------- */
function renderChips() {
  const cats = [...new Set(cat.products.map(p => p.category).filter(Boolean))];
  const cs = ['ทั้งหมด', ...(cat.packages.length ? ['แพ็กเกจ'] : []), ...cats];
  if (!cs.includes(chip)) chip = 'ทั้งหมด';
  $('chips').innerHTML = cs.map(c => `<div class="chip ${c === chip ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</div>`).join('');
  $('chips').querySelectorAll('.chip').forEach(el => el.onclick = () => { chip = el.dataset.c; renderChips(); renderGrid(); });
  renderGrid();
}
function inCart(id) { return cart.filter(c => c.id === id || c.pid === id).reduce((a, c) => a + c.qty, 0); }
function badge(n) { return n ? `<div class="badge">${n}</div>` : ''; }
function stockTxt(n) { return `<div class="s ${n <= 0 ? 'low' : ''}">คงเหลือ ${n}</div>`; }
function renderGrid() {
  const q = $('q').value.trim().toLowerCase();
  const hit = (...s) => !q || s.some(x => String(x || '').toLowerCase().includes(q));
  let h = '';
  if (chip === 'ทั้งหมด' || chip === 'แพ็กเกจ') h += cat.packages.filter(k => hit(k.name)).map(k => `<div class="card pk" onclick="openPk('${k.package_id}')">${badge(inCart(k.package_id))}<div class="img">${imgHtml(k.image_url, '🎁')}</div><div class="n">${esc(k.name)}</div><div class="p">${money(k.price)}฿</div><div class="s">แพ็กเกจ</div></div>`).join('');
  if (chip !== 'แพ็กเกจ') h += cat.products.filter(p => (chip === 'ทั้งหมด' || p.category === chip) && hit(p.name, p.sku, p.subcategory, ...varsOf(p.product_id).map(v => v.sku))).map(p => {
    const vs = varsOf(p.product_id);
    const st = p.has_variants ? vs.reduce((a, v) => a + v.stock_qty, 0) : p.stock_qty;
    const price = p.has_variants && vs.length ? Math.min(...vs.map(vPrice)) : p.price;
    return `<div class="card" onclick="tapP('${p.product_id}')">${badge(inCart(p.product_id))}<div class="img">${imgHtml(p.image_url, emojiOf(p))}</div><div class="n">${esc(p.name)}</div><div class="p">${money(price)}฿</div>${stockTxt(st)}</div>`;
  }).join('');
  $('grid').innerHTML = h || '<div class="empty" style="grid-column:1/-1">ไม่พบสินค้า</div>';
}
function addLine(line) { const ex = cart.find(c => c.key === line.key); if (ex) ex.qty++; else cart.push({ ...line, qty: 1 }); renderCart(); }
function tapP(id) {
  const p = P(id);
  if (p.has_variants) return openVar(p);
  addLine({ key: id, type: 'product', id, name: p.name, price: p.price });
}
function openVar(p) {
  const vs = varsOf(p.product_id);
  $('varSheet').innerHTML = `<h3>${esc(p.name)}</h3>` + (vs.length ? `<div class="opt">${vs.map(v => `<button onclick="addVar('${v.variant_id}')">${esc([v.size, v.color].filter(Boolean).join(' / '))} <small style="opacity:.7">(${v.stock_qty})</small></button>`).join('')}</div>` : '<div class="empty">ยังไม่มีตัวเลือกไซซ์/สี</div>') + `<br><button class="btn g" onclick="closeM('mVar')">ปิด</button>`;
  $('mVar').classList.add('on');
}
function addVar(vid) { const v = V(vid); closeM('mVar'); addLine({ key: vid, type: 'variant', id: vid, pid: v.product_id, name: vName(v), price: vPrice(v) }); }

/* ---------- package picker: แต่ละช่องมีหลายบรรทัด (เลือกสินค้า + จำนวน) ---------- */
let pk = null;
function openPk(id) {
  const k = cat.packages.find(x => x.package_id === id);
  const rows = {};
  k.slots.forEach(s => {
    const n = Math.max(1, s.lines || 1);
    rows[s.slot] = Array.from({ length: n }, (_, i) => ({ id: s.items.length === 1 && i === 0 ? s.items[0] : '', qty: i === 0 ? s.qty : 0 }));
  });
  pk = { k, rows };
  renderPk();
  $('mPk').classList.add('on');
}
const slotSum = s => pk.rows[s.slot].reduce((a, r) => a + (r.qty || 0), 0);
function renderPk() {
  const k = pk.k;
  $('pkSheet').innerHTML = `<h3>${esc(k.name)} · ${money(k.price)}฿</h3>${k.description ? `<div style="color:#888;font-size:13px">${esc(k.description)}</div>` : ''}` + k.slots.map(s => {
    const sum = slotSum(s), okc = sum === s.qty ? 'ok' : sum > s.qty ? 'over' : '';
    return `<div class="pkslot"><div class="pkh"><b>ช่อง ${esc(s.slot)}</b><span>เลือกรวม ${s.qty} ชิ้น</span><span class="pkst ${okc}">${sum}/${s.qty}${okc === 'ok' ? ' ✓' : ''}</span></div>` +
      pk.rows[s.slot].map((r, i) => `<div class="pkrow"><select data-s="${esc(s.slot)}" data-i="${i}"><option value="">— เลือกสินค้า —</option>${s.items.map(it => `<option value="${esc(it)}" ${it === r.id ? 'selected' : ''}>${esc(itemName(it))} (เหลือ ${itemStock(it) ?? '-'})</option>`).join('')}</select><button class="qbtn ${r.qty ? '' : 'zero'}" data-s="${esc(s.slot)}" data-i="${i}">${r.qty}</button></div>`).join('') + '</div>';
  }).join('') + `<br><button class="btn" onclick="addPk()">เพิ่มเซตลงตะกร้า</button><br><br><button class="btn g" onclick="closeM('mPk')">ยกเลิก</button>`;
  $('pkSheet').querySelectorAll('select[data-s]').forEach(el => el.onchange = () => {
    const s = pk.k.slots.find(x => x.slot === el.dataset.s), r = pk.rows[s.slot][+el.dataset.i];
    r.id = el.value;
    if (r.id && !r.qty) r.qty = Math.max(0, s.qty - slotSum(s));
    if (!r.id) r.qty = 0;
    renderPk();
  });
  $('pkSheet').querySelectorAll('.qbtn').forEach(b => b.onclick = () => {
    const s = pk.k.slots.find(x => x.slot === b.dataset.s), r = pk.rows[s.slot][+b.dataset.i];
    numpad(`ช่อง ${s.slot} · ${r.id ? itemName(r.id) : 'จำนวน'}`, r.qty, v => { r.qty = v; renderPk(); });
  });
}
function addPk() {
  const k = pk.k, selections = {}, desc = [];
  for (const s of k.slots) {
    const merged = {};
    for (const r of pk.rows[s.slot]) {
      if (r.qty > 0 && !r.id) return POS.toast(`ช่อง ${s.slot}: เลือกสินค้าให้บรรทัดที่ใส่จำนวนไว้`, true);
      if (r.id && r.qty > 0) merged[r.id] = (merged[r.id] || 0) + r.qty;
    }
    const sum = Object.values(merged).reduce((a, b) => a + b, 0);
    if (sum !== s.qty) return POS.toast(`ช่อง ${s.slot} ต้องเลือกรวม ${s.qty} ชิ้น (ตอนนี้ ${sum})`, true);
    selections[s.slot] = Object.keys(merged).sort().map(id => ({ id, qty: merged[id] }));
    desc.push(s.slot + ': ' + selections[s.slot].map(x => itemName(x.id).replace(/^May Protein /, '') + (s.qty > 1 ? '×' + x.qty : '')).join(', '));
  }
  closeM('mPk');
  addLine({ key: k.package_id + '|' + JSON.stringify(selections), type: 'package', id: k.package_id, name: k.name, price: k.price, selections, desc: desc.join(' · ') });
}

/* ---------- numpad ---------- */
let np = null;
function numpad(title, value, onOk) {
  np = { v: String(value || ''), onOk, fresh: true };
  $('npTitle').textContent = title;
  renderNp();
  $('mNum').classList.add('on');
}
function renderNp() { $('npVal').textContent = np.v === '' ? '0' : np.v; }
function npKey(k) {
  if (k === 'del') np.v = np.fresh ? '' : np.v.slice(0, -1);
  else if (k === 'clr') np.v = '';
  else { if (np.fresh) np.v = ''; if (np.v.length < 3) np.v = (np.v === '0' ? '' : np.v) + k; }
  np.fresh = false;
  renderNp();
}
function npOk() { const v = parseInt(np.v || '0', 10) || 0; closeM('mNum'); np.onOk(v); }

function chg(i, d) { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); renderCart(); }
function clearCart() { if (cart.length && confirm('ล้างสินค้าทั้งหมดในตะกร้า?')) { cart = []; renderCart(); } }
function cartTotal() { return cart.reduce((a, c) => a + c.price * c.qty, 0); }
function renderCart() {
  $('lines').innerHTML = cart.map((c, i) => `<div class="line"><div class="nm">${esc(c.name)}${c.desc ? `<small>${esc(c.desc)}</small>` : ''}<small>${money(c.price)}฿ / ชิ้น</small></div><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${c.qty}</b><button onclick="chg(${i},1)">+</button></div><div class="lt">${money(c.price * c.qty)}฿</div></div>`).join('') || '<div class="empty">แตะสินค้าด้านบนเพื่อเพิ่มลงตะกร้า</div>';
  $('sum').textContent = money(cartTotal());
  $('cnt').textContent = cart.reduce((a, c) => a + c.qty, 0);
  renderGrid();
}
function closeM(m) { $(m).classList.remove('on'); }

/* ---------- checkout ---------- */
function openCheckout() { if (!cart.length) return; clientId = POS.uuid(); $('mPay').classList.add('on'); calc(); renderQr(); renderSlip(); }

/* ---------- รูปสลิป (โอน / พร้อมเพย์) ---------- */
let slip = null;
const needsSlip = () => method === 'transfer' || method === 'promptpay';
function renderSlip() {
  const box = $('slipBox');
  if (!needsSlip()) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = slip
    ? `<div class="slip"><img src="${slip.preview}" alt="สลิป"><div class="t"><b>✅ ถ่ายรูปสลิปแล้ว</b>จะบันทึกไว้กับบิลนี้</div><div class="acts"><button class="btn sm line" onclick="takeSlip()">ถ่ายใหม่</button><button class="btn sm g" onclick="slip=null;renderSlip()">ลบ</button></div></div>`
    : `<div class="slip"><div class="t"><b>📷 รูปสลิปการโอน</b>ถ่ายรูปสลิปบนมือถือลูกค้าเก็บไว้เป็นหลักฐาน (ถ้ายังไม่ถ่าย จะเปิดกล้องให้ตอนกดยืนยัน)</div><button class="btn sm" onclick="takeSlip()">ถ่ายรูป</button></div>`;
}
async function takeSlip() {
  const file = await POS.pickFile($('slipIn'));
  if (!file) return false;
  try {
    const data = await POS.jpegImage(file, 1280, 0.7);
    slip = { data, preview: 'data:image/jpeg;base64,' + data };
    renderSlip();
    return true;
  } catch (e) { POS.toast(e.message, true); return false; }
}
function calc() {
  const s = cartTotal(), d = Math.max(0, +$('disc').value || 0), t = $('dtype').value;
  const da = Math.min(s, t === 'percent' ? s * Math.min(d, 100) / 100 : d);
  $('sub').textContent = money(s); $('net').textContent = money(s - da);
  if ($('qrFull').classList.contains('on')) renderQr();
  return { s, da, net: s - da };
}
function renderQr() {
  const box = $('qrBox');
  if (method !== 'promptpay') { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const url = cat.settings.promptpay_qr_image_url;
  box.innerHTML = url ? `<img class="qrimg" src="${esc(url)}" alt="QR"><button class="btn sm line" onclick="showQrFull()">🔍 แสดง QR เต็มจอให้ลูกค้าสแกน</button>` : '<div class="empty">ยังไม่ได้อัปโหลดรูป QR (แอดมินตั้งค่าได้ที่หลังบ้าน)</div>';
}
function showQrFull() {
  const url = cat.settings.promptpay_qr_image_url;
  $('qrFull').innerHTML = `<img src="${esc(url)}" alt="QR"><div class="amt">${money(calc().net)} บาท</div><div style="color:#888">แตะเพื่อปิด</div>`;
  $('qrFull').classList.add('on');
}
async function pay() {
  if (paying) return;
  if (needsSlip() && !slip) {
    // เปิดกล้องทันทีจากการกดปุ่มยืนยัน
    const got = await takeSlip();
    if (!got && !confirm('ยังไม่มีรูปสลิป บันทึกการขายต่อเลยไหม?')) return;
  }
  const { net } = calc();
  paying = true; $('payBtn').disabled = true; $('payBtn').innerHTML = '<span class="spin"></span> กำลังบันทึก';
  try {
    const r = await POS.call('createSale', {
      client_id: clientId, event_name: POS.pref('event') || '', payment_method: method,
      discount_type: $('dtype').value, discount_value: +$('disc').value || 0, note: $('note').value.trim(),
      slip_data: needsSlip() && slip ? slip.data : '',
      lines: cart.map(c => ({ type: c.type, id: c.id, qty: c.qty, selections: c.selections }))
    });
    const b = r.bill;
    if (Math.abs(b.total - net) > 0.01) POS.toast('ยอดสุทธิจากเซิร์ฟเวอร์: ' + money(b.total) + ' บาท');
    cart = []; renderCart(); closeM('mPay'); $('qrFull').classList.remove('on');
    $('disc').value = 0; $('note').value = ''; clientId = null; slip = null;
    $('okSheet').innerHTML = `<div class="ic">✅</div><div>ขายสำเร็จ</div><div class="bn">${esc(b.bill_id)}</div><small style="color:#888">${esc(b.datetime)}</small>${receiptHtml(b)}<button class="btn" onclick="closeM('mOk')">🛒 บิลถัดไป</button>`;
    $('mOk').classList.add('on');
    b.items.forEach(i => { if (i.package_id && !i.slot) return; const p = P(i.item_id), v = V(i.item_id); if (p) p.stock_qty -= i.qty; if (v) v.stock_qty -= i.qty; });
    saveCatalogCache(); renderGrid();
    loadCatalog();
  } catch (e) { POS.toast(e.message, true); }
  paying = false; $('payBtn').disabled = false; $('payBtn').textContent = '✅ ยืนยันการขาย';
}
function receiptHtml(b) {
  const head = b.items.filter(i => !i.slot);
  return `<div class="rc">${head.map(it => {
    const comps = it.package_id ? b.items.filter(x => x.slot && x.package_set_no === it.package_set_no) : [];
    return `<div class="r"><span>${esc(it.item_name)} × ${it.qty}${comps.length ? `<small>${comps.map(c => esc(c.slot + ': ' + c.item_name.replace(/^May Protein /, '') + (c.qty / it.qty > 1 ? '×' + (c.qty / it.qty) : ''))).join(' · ')}</small>` : ''}</span><span>${money(it.line_total)}฿</span></div>`;
  }).join('')}
  <div class="r" style="border-top:1px dashed #ccc;margin-top:6px;padding-top:6px"><span>รวม</span><span>${money(b.subtotal)}฿</span></div>
  ${b.discount_amount ? `<div class="r"><span>ส่วนลด${b.discount_type === 'percent' ? ' ' + b.discount_value + '%' : ''}</span><span>-${money(b.discount_amount)}฿</span></div>` : ''}
  <div class="r"><b>ยอดสุทธิ</b><b>${money(b.total)}฿</b></div>
  <div class="r"><small>ชำระโดย ${MLABEL[b.payment_method] || esc(b.payment_method)}</small><small>${esc(b.staff || '')}</small></div>
  ${b.note ? `<div class="r"><small>หมายเหตุ: ${esc(b.note)}</small></div>` : ''}
  ${b.slip_url ? `<div class="r"><small>📎 ${POS.isAdmin() ? `<a href="${esc(b.slip_url)}" target="_blank" rel="noopener">ดูรูปสลิป</a>` : 'เก็บรูปสลิปแล้ว'}</small></div>` : ''}</div>`;
}

/* ---------- today (admin) ---------- */
async function loadToday(force) {
  if (!POS.isAdmin()) return;
  if (!today.bills.length || force) $('billList').innerHTML = '<div class="loading"><span class="spin dark"></span>กำลังโหลด</div>';
  try { today = await POS.call('todaySales'); renderBills(); renderSum(); }
  catch (e) { POS.toast(e.message, true); }
}
function renderBills() {
  const bs = today.bills;
  $('bCnt').textContent = bs.length; $('bSum').textContent = money(bs.reduce((a, b) => a + b.total, 0));
  $('billList').innerHTML = bs.map(b => `<div class="bill"><div class="h" onclick="this.parentNode.classList.toggle('open')"><span><b>${esc(b.bill_id)}</b><span class="tag">${MLABEL[b.payment_method] || ''}</span><br><small style="color:#888">${esc(b.datetime.slice(11, 16))} น. · ${b.items.filter(i => !i.slot).reduce((a, i) => a + i.qty, 0)} ชิ้น · ${esc(b.staff)}</small></span><b>${money(b.total)}฿</b></div><div class="d">${receiptHtml(b)}</div></div>`).join('') || '<div class="empty">ยังไม่มีการขายวันนี้</div>';
}
function aggregate() {
  const bs = today.bills, by = m => bs.filter(b => b.payment_method === m).reduce((a, b) => a + b.total, 0);
  const pk = {}, it = {};
  bs.forEach(b => b.items.forEach(i => {
    if (i.package_id && !i.slot) { pk[i.item_name] = (pk[i.item_name] || 0) + i.qty; return; }
    it[i.item_name] = (it[i.item_name] || 0) + i.qty;
  }));
  return { total: bs.reduce((a, b) => a + b.total, 0), disc: bs.reduce((a, b) => a + b.discount_amount, 0), cash: by('cash'), tr: by('transfer'), pp: by('promptpay'), pk, it };
}
function renderSum() {
  const g = aggregate();
  $('kTotal').textContent = money(g.total); $('kBills').textContent = today.bills.length;
  $('kCash').textContent = money(g.cash); $('kTr').textContent = money(g.tr); $('kPP').textContent = money(g.pp); $('kDisc').textContent = money(g.disc);
  const rows = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
  $('pkTable').innerHTML = rows(g.pk).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v} เซต</td></tr>`).join('') || '<tr><td>-</td></tr>';
  $('itTable').innerHTML = rows(g.it).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('') || '<tr><td>-</td></tr>';
}
function downloadCsv() {
  const g = aggregate(), q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const out = [['สรุปยอดขาย', today.date], ['ยอดขายสุทธิ', g.total], ['จำนวนบิล', today.bills.length], ['เงินสด', g.cash], ['โอน', g.tr], ['พร้อมเพย์', g.pp], ['ส่วนลดรวม', g.disc], [],
    ['แพ็กเกจ', 'จำนวนเซต'], ...Object.entries(g.pk), [], ['สินค้า', 'จำนวน'], ...Object.entries(g.it), [],
    ['bill_id', 'datetime', 'event', 'staff', 'payment', 'item', 'slot', 'qty', 'unit_price', 'line_total', 'bill_subtotal', 'bill_discount', 'bill_total', 'note', 'slip_url']];
  today.bills.slice().reverse().forEach(b => b.items.forEach((i, n) => out.push([b.bill_id, b.datetime, b.event_name, b.staff, b.payment_method, i.item_name, i.slot, i.qty, i.unit_price, i.line_total, n ? '' : b.subtotal, n ? '' : b.discount_amount, n ? '' : b.total, n ? '' : b.note, n ? '' : b.slip_url])));
  const csv = '﻿' + out.map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `mayprotein-sales-${today.date}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
